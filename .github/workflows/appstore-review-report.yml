name: App Store Review Report

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write App Store Connect private key
        run: |
          cat > asc_private_key.p8 <<'EOF'
          ${{ secrets.ASC_PRIVATE_KEY }}
          EOF

      - name: Run review report
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_PATH: ./asc_private_key.p8
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          FEISHU_KEYWORD: ${{ secrets.FEISHU_KEYWORD }}
          ASC_REVIEW_STATES: ${{ secrets.ASC_REVIEW_STATES }}
          ASC_APP_IDS: ${{ secrets.ASC_APP_IDS }}
          REPORT_EMPTY_RESULT: ${{ secrets.REPORT_EMPTY_RESULT }}
        run: python appstore_review_report.py
