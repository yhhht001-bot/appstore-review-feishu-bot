name: App Store Review Report

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore previous state
        run: |
          mkdir -p .state
          if git ls-remote --exit-code --heads origin bot-state >/dev/null 2>&1; then
            git fetch origin bot-state:bot-state
            git show bot-state:state/appstore_review_state.json > .state/appstore_review_state.json || true
          else
            echo "bot-state 分支不存在，首次运行会自动初始化快照"
          fi

      - name: Write App Store Connect private key
        run: |
          cat > asc_private_key.p8 <<'EOF'
          ${{ secrets.ASC_PRIVATE_KEY }}
          EOF

      - name: Run review report
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_PATH: ./asc_private_key.p8
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          FEISHU_KEYWORD: ${{ secrets.FEISHU_KEYWORD }}
          ASC_APP_IDS: ${{ secrets.ASC_APP_IDS }}
          STATE_FILE_PATH: ./.state/appstore_review_state.json
        run: python appstore_review_report.py

      - name: Persist state
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f .state/appstore_review_state.json ]; then
            echo "没有可持久化的状态文件"
            exit 0
          fi

          cp .state/appstore_review_state.json /tmp/appstore_review_state.json
          mkdir -p /tmp/appstore-review-state-repo
          cd /tmp/appstore-review-state-repo

          git init
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin bot-state >/dev/null 2>&1 || true

          if git rev-parse --verify FETCH_HEAD >/dev/null 2>&1; then
            git checkout -B bot-state FETCH_HEAD
          else
            git checkout --orphan bot-state
          fi

          mkdir -p state
          cp /tmp/appstore_review_state.json state/appstore_review_state.json

          git add state/appstore_review_state.json
          if git diff --cached --quiet; then
            echo "状态快照没有变化"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update app review state snapshot"
          git push origin bot-state
